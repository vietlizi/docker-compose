version: '3.8'

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: powerpod-vaultwarden
    environment:
      - TS_AUTHKEY=REPLACE_YOUR_AUTHKEY_HERE
      - TS_EXTRA_ARGS=--accept-dns=false
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped
    network_mode: host
    command: >
      sh -c "
        tailscaled --state=${TS_STATE_DIR}/tailscaled.state &
        sleep 5 &&
        tailscale up --authkey=${TS_AUTHKEY} --accept-dns=false
      "

  vaultwarden:
    image: vaultwarden/server:latest
    depends_on:
      - tailscale
    volumes:
      - vw-data:/data
    network_mode: host
    restart: unless-stopped

volumes:
  tailscale-state:
  vw-data:
